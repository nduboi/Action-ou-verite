services:

  app_js:
    build: ./front
    container_name: truthordare
    ports:
      - "${APP_PORT}:3000"
    volumes:
      - ./front:/app
    env_file:
      - db_log.env
      - mail.env
      - pma.env
      - api_token.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - result-tier

  api_js:
    build: ./api_server
    container_name: truthordare_api
    volumes:
      - ./api_server:/app_api
    ports:
      - "${API_PORT}:8080"
    env_file:
      - db_log.env
      - mail.env
      - pma.env
      - api_token.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - result-tier

  db:
    image: mysql:latest
    restart: always
    container_name: database
    env_file:
      - db_log.env
    ports:
      - "3306"
    volumes:
      - ./data_table.sql:/docker-entrypoint-initdb.d/setup.sql
      - db-data:/var/lib/mysql
    networks:
      - result-tier
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 2s
      timeout: 1s
      retries: 30

  phpmyadmin:
    image: phpmyadmin
    container_name: PHPmyAdmin
    networks:
      - result-tier
    env_file:
      - pma.env
    restart: always
    ports:
      - ${PHPMYADMIN_PORT}:80
    depends_on:
      db:
        condition: service_healthy

networks:
  result-tier:
    driver: bridge

volumes:
  db-data:
    driver: local

