apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.35.0 (9532ceef3)
  labels:
    io.kompose.service: app-js
  name: app-js
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: app-js
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.35.0 (9532ceef3)
      labels:
        io.kompose.service: app-js
    spec:
      containers:
        - env:
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  key: MYSQL_DATABASE
                  name: db-log-env
            - name: MYSQL_HOST
              valueFrom:
                configMapKeyRef:
                  key: MYSQL_HOST
                  name: db-log-env
            - name: MYSQL_PASSWORD
              valueFrom:
                configMapKeyRef:
                  key: MYSQL_PASSWORD
                  name: db-log-env
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                configMapKeyRef:
                  key: MYSQL_ROOT_PASSWORD
                  name: db-log-env
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  key: MYSQL_USER
                  name: db-log-env
            - name: PMA_HOST
              valueFrom:
                configMapKeyRef:
                  key: PMA_HOST
                  name: pma-env
            - name: PMA_PORT
              valueFrom:
                configMapKeyRef:
                  key: PMA_PORT
                  name: pma-env
            - name: SECRET_KEY_JWT
              valueFrom:
                configMapKeyRef:
                  key: SECRET_KEY_JWT
                  name: api-token-env
          image: nduuboi/truthordare:latest
          name: truthordare
          ports:
            - containerPort: 3000
              protocol: TCP
      restartPolicy: Always
