apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.35.0 (9532ceef3)
  labels:
    io.kompose.service: phpmyadmin
  name: phpmyadmin
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: phpmyadmin
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.35.0 (9532ceef3)
      labels:
        io.kompose.service: phpmyadmin
    spec:
      containers:
        - env:
            - name: PMA_HOST
              valueFrom:
                configMapKeyRef:
                  key: PMA_HOST
                  name: pma-env
            - name: PMA_PORT
              valueFrom:
                configMapKeyRef:
                  key: PMA_PORT
                  name: pma-env
          image: phpmyadmin
          name: phpmyadmin
          ports:
            - containerPort: 80
              protocol: TCP
      restartPolicy: Always
